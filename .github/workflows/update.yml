name: Update dependencies

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-nixpkgs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update dependencies
        run: |
          inputs_json=$(nix eval --json --file flake.nix \
            --apply 'flake: builtins.attrNames (builtins.removeAttrs flake.inputs [ "my-secrets" ])')
          mapfile -t inputs < <(jq --raw-output '.[]' <<< "$inputs_json")
          # With no arguments, Nix would update every input, including my-secrets.
          if (( ${#inputs[@]} == 0 )); then
            echo "No public inputs to update."
            exit 0
          fi
          nix flake update "${inputs[@]}"

      - name: Commit lockfile update
        run: |
          if git diff --quiet -- flake.lock; then
            echo "Everything already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "update: Update flake inputs"
          git push
