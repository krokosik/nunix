    amount_digits: 0
    amount_lowercase: 0
    amount_symbols: 0
    amount_uppercase: 0
    check_have_i_been_pwned: false
    check_static_rules: true
    check_zxcvbn: true
    error_message: Password needs to be 8 characters or longer.
    execution_logging: false
    hibp_allowed_count: 0
    length_min: 8
    password_field: password
    symbol_charset: '!\"#$%&''()*+,-./:;<=>?@[\]^_`{|}~ '
    zxcvbn_score_threshold: 2
