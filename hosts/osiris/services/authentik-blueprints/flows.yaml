- model: authentik_policies_expression.expressionpolicy
  id: expressionpolicy-ensure-unique-email
  identifiers:
    name: ensure-unique-email
  attrs:
    execution_logging: false
    expression: |-
      # Ensure this matches the *Field Key* value of the prompt
      field_name = "email"
      email = request.context["prompt_data"][field_name]
      pending_user = request.context.get("pending_user")

      from authentik.core.models import User
      query = User.objects.filter(email__iexact=email)
      if pending_user:
          query = query.exclude(pk=pending_user.pk)

      if query.exists():
          ak_message("Email address in use")
          return False

      return True
- model: authentik_policies_expression.expressionpolicy
  id: expressionpolicy-default-authentication-flow-password-stage
  identifiers:
    name: default-authentication-flow-password-stage
  attrs:
    execution_logging: false
    expression: |-
      flow_plan = request.context.get("flow_plan")
      if not flow_plan:
          return True
      # If the user does not have a backend attached to it, they haven't
      # been authenticated yet and we need the password stage
      return not hasattr(flow_plan.context.get("pending_user"), "backend")
- model: authentik_policies_expression.expressionpolicy
  id: expressionpolicy-default-authentication-flow-authenticator-validate-stage
  identifiers:
    name: default-authentication-flow-authenticator-validate-stage
  attrs:
    execution_logging: false
    expression: |-
      flow_plan = request.context.get("flow_plan")
      if not flow_plan:
          return True
      # if the authentication method is webauthn (passwordless), then we skip the authenticator
      # validation stage by returning false (true will execute the stage)
      return not (flow_plan.context.get("auth_method") == "auth_webauthn_pwl")
- model: authentik_policies_expression.expressionpolicy
  id: expressionpolicy-default-source-authentication-if-sso
  identifiers:
    name: default-source-authentication-if-sso
  attrs:
    execution_logging: false
    expression: |-
      # This policy ensures that this flow can only be used when the user
      # is in a SSO Flow (meaning they come from an external IdP)
      return ak_is_sso_flow
- model: authentik_policies_expression.expressionpolicy
  id: expressionpolicy-default-oobe-prefill-user
  identifiers:
    name: default-oobe-prefill-user
  attrs:
    execution_logging: false
    expression: |-
      # This policy sets the user for the currently running flow
      # by injecting "pending_user"
      akadmin = ak_user_by(username="akadmin")
      context["flow_plan"].context["pending_user"] = akadmin
      return True
- model: authentik_policies_expression.expressionpolicy
  id: expressionpolicy-default-source-enrollment-if-username
  identifiers:
    name: default-source-enrollment-if-username
  attrs:
    execution_logging: false
    expression: |-
      # Check if we''ve not been given a username by the external IdP
      # and trigger the enrollment flow
      return 'username' not in context.get('prompt_data', {})
- model: authentik_policies_expression.expressionpolicy
  id: expressionpolicy-default-source-enrollment-if-sso
  identifiers:
    name: default-source-enrollment-if-sso
  attrs:
